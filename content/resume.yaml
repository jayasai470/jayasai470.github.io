# Order here is display order — add a new entry at the top for your latest role.
experience:
  - company: Samsung Electronics America
    title: Staff Engineer, Back-End Server
    dateFrom: Feb 2025
    dateTo: Present
    summary: >
      Lead backend and DevOps engineer on Samsung TV's interactive advertising platform, across
      server-side ad insertion, playable ads, and AI-driven recommendations.
    highlights:
      - Built an in-house linear channel origin for Samsung Smart TVs' FAST (free ad-supported streaming TV) service on Node.js/NestJS and Kubernetes (EKS), in place of AWS Elemental MediaTailor Channel Assembly, assembling looping and scheduled playlists for ambient channels into continuous HLS streams through a CDN-backed origin.
      - Implemented server-side ad insertion (SSAI) using SCTE-35 markers, and a VAST-compliant ad service that routes Samsung TV ad inventory to interactive mini-games served as playable ads.
      - Designed a real-time ad-event analytics pipeline (AWS Kinesis, S3, Glue, Athena) that captures VAST tracking events, with QuickSight dashboards for playable-ad performance reporting.
      - Built a custom Kubernetes controller to reconcile published channels in MySQL with Kubernetes custom resources (CRDs), which automates channel infrastructure management.
      - Developed a GPT-based movie recommendation system using Retrieval-Augmented Generation (RAG) with LangChain and Azure OpenAI, and vector search using Azure AI Search and Redis.
      - Set up Claude and Codex on Amazon Bedrock for internal developers, and onboarded engineering teams onto them.
      - Owned a seven-version, zero-downtime Kubernetes upgrade (1.26 to 1.33) with a staged rollout, per-step validation, and a documented rollback runbook.
      - Migrated observability to OpenTelemetry for a single instrumentation standard across logs, metrics, and traces, with CloudWatch dashboards and PagerDuty on-call routing built on top.
      - Wrote k6 performance tests and automated their runs, with custom reports and alerting.
      - Cut AWS spend with rightsizing and instance strategy, automated cleanup of idle resources, and per-team cost visibility backed by budget alarms.
      - Cut internal egress costs by 75% by moving service traffic to VPC endpoints through route table changes.
      - Own CI/CD and production operations for these systems. Every release reaches production through Terraform and Helm, and the remediations that page most often are automated away.

  - company: Samsung Electronics America
    title: Engineer 3, Software Process Engineer
    dateFrom: March 2022
    dateTo: Jan 2025
    summary: >
      Built and operated a low-latency cloud game streaming platform, including the GPU
      virtualization and storage systems behind a custom Kubernetes-based game infrastructure.
    highlights:
      - Automated GPU-backed virtual game machine provisioning with KubeVirt (Kubernetes + VMs) across AWS and OCI bare-metal, running games on NVIDIA and AMD GPUs via vGPU/SR-IOV on Windows and Linux.
      - Automated optimized EKS/OKE machine images for game streaming using Packer (qcow2 format), including host GPU driver management.
      - Added a custom Kubernetes host-port operator to make game machines externally reachable at lower cost, and containerized Windows games to run on Linux using Wine.
      - Stood up and ran a Rook + Ceph storage cluster for Read-Only-Many (ROX) persistent volumes, which AWS did not support natively.
      - Extended the Puppetlabs PVPool controller with Kubernetes volume snapshots, which cut PVC replication for game data to near-instant.
      - Delivered sub-100ms end-to-end latency for interactive cloud gameplay.

  - company: Samsung Electronics America
    title: Engineer 2, Software Process Engineer
    dateFrom: July 2019
    dateTo: Feb 2022
    summary: >
      Built reactive, event-driven microservices and real-time stream processing systems for
      wearable and B2B platforms.
    highlights:
      - Built and ran Node.js backend services on Kubernetes (EKS), deployed with Helm, behind B2B applications on Samsung's wearable platform, among them beacon-based indoor positioning for proximity detection and contact tracing for wearable devices.
      - Used Apache Flink for real-time stream processing with Complex Event Processing (CEP) for advanced event pattern detection.
      - Designed event-driven microservices on a Function-as-a-Service (FaaS) model on AWS, with deployment automation via the Serverless framework.
      - Built fully reactive applications with Java, Spring WebFlux, MongoDB, and Kafka, and designed GraphQL APIs for client data access.
      - Engineered multi-region traffic infrastructure with Terraform to meet regulatory compliance requirements, and ran the team's private npm/Helm artifact repositories (Sinopia, S3).

  - company: First Object Inc
    title: Server Engineer
    dateFrom: Aug 2015
    dateTo: July 2019
    summary: >
      Delivered geospatial, serverless backend services and full-stack applications across
      global regions.
    highlights:
      # Quoted: unquoted, YAML reads "Client: ..." as a mapping, not a string.
      - "Client: Samsung Electronics America."
      - Developed and deployed serverless applications across multiple global AWS regions to minimize latency, with geospatial queries and geohashing powering geofence and location-based alerting.
      - Integrated mapping APIs including OpenStreetMap, Leaflet, Google Maps, and HERE Maps for geocoding and location-data visualization.
      - Built Spring Boot microservices and IoT applications using the MQTT protocol for device communication.
      - Designed a reactive, real-time UI using Meteor, Handlebars, and MongoDB, and contributed across the stack including CMS (Magnolia) and Kafka streaming.
      - Conducted rapid prototyping of proof-of-concept systems and matured them into production-grade AWS deployments.

