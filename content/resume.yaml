# Order here is display order — add a new entry at the top for your latest role.
experience:
  - company: Samsung Electronics America
    title: Staff Engineer, Back-End Server
    dateFrom: Feb 2025
    dateTo: Present
    summary: >
      Lead backend and DevOps engineer for Samsung TV's interactive advertising platform,
      spanning server-side ad insertion, playable ad experiences, and AI-driven recommendations.
    highlights:
      - Architected a server-side, ad-supported linear "FAST channel" streaming platform for Samsung Smart TVs on Node.js/NestJS and Kubernetes (EKS), assembling looping and scheduled playlists into continuous live streams delivered via HLS through a CDN-backed origin.
      - Implemented server-side ad insertion (SSAI) using SCTE-35 markers and built a scheduling engine for fixed-time-window content blocks with automatic filler coverage, enabling live, in-place channel editing with zero stream interruption.
      - Built a custom Kubernetes controller that reconciles published channels in MySQL with corresponding Kubernetes CRDs, and a VAST-compliant ad service routing TV ad inventory to a portfolio of interactive mini-games served as playable ad creative.
      - Designed a real-time analytics pipeline (AWS Kinesis, S3, Glue, Athena) capturing VAST tracking events, with QuickSight dashboards for playable-ad performance reporting.
      - Developed a GPT-based movie recommendation system using custom Retrieval-Augmented Generation (RAG) with LangChain, Azure OpenAI, and vector search (Azure AI Search, Redis).
      - Owned a seven-version, zero-downtime Kubernetes upgrade (1.26 to 1.33) with a staged rollout, per-step validation, and a documented rollback runbook.
      - Manage infrastructure as code with Terraform and Helm as the single path to production.
      - Carry on-call for these backend systems, shaping alerting from real incidents and automating recurring remediations to cut repeat pages.
      - Migrated observability to OpenTelemetry for unified logs, metrics, and traces, with CloudWatch dashboards and PagerDuty integration for on-call routing.

  - company: Samsung Electronics America
    title: Engineer 3, Software Process Engineer
    dateFrom: March 2022
    dateTo: Jan 2025
    summary: >
      Built and operated a low-latency cloud game streaming platform, engineering GPU
      virtualization and storage systems for a custom Kubernetes-based game infrastructure.
    highlights:
      - Engineered automation for virtual game machine provisioning using KubeVirt (Kubernetes + VMs) across AWS and OCI bare-metal, running games on Nvidia and AMD GPUs via vGPU/SR-IOV on Windows and Linux.
      - Automated optimized EKS/OKE machine images for game streaming using Packer (qcow2 format), including host GPU driver management, to streamline deployment.
      - Designed a custom Kubernetes host-port operator to make game machines accessible economically, and containerized Windows games to run on Linux using Wine.
      - Established and managed a Rook + Ceph storage cluster to support Read-Only-Many (ROX) persistent volumes, compensating for a gap in native AWS support.
      - Extended the Puppetlabs PVPool controller with Kubernetes volume snapshots, enabling near-instant PVC replication for efficient game data hosting.
      - Delivered sub-100ms end-to-end latency for interactive cloud gameplay across the platform.

  - company: Samsung Electronics America
    title: Engineer 2, Software Process Engineer
    dateFrom: July 2019
    dateTo: Feb 2022
    summary: >
      Built reactive, event-driven microservices and real-time stream processing systems for
      wearable and B2B platforms.
    highlights:
      - Built and operated Node.js backend services on Kubernetes (EKS), deployed via Helm, powering B2B applications across Samsung's wearable platform.
      - Built an indoor positioning system using beacon technology for proximity detection and contributed to contact-tracing solutions for wearable devices.
      - Used Apache Flink for real-time stream processing with Complex Event Processing (CEP) for advanced event pattern detection.
      - Designed event-driven microservices on a Function-as-a-Service (FaaS) model on AWS, with deployment automation via the Serverless framework.
      - Built fully reactive applications with Spring WebFlux, MongoDB, and Kafka, and designed GraphQL APIs for client data access.
      - Engineered multi-region traffic infrastructure with Terraform to meet regulatory compliance requirements, and ran the team's private npm/Helm artifact repositories (Sinopia, S3).

  - company: First Object Inc
    title: Server Engineer (Contracted to Samsung Electronics America)
    dateFrom: Aug 2015
    dateTo: July 2019
    summary: >
      Delivered geospatial, serverless backend services and full-stack applications across
      global regions.
    highlights:
      - Developed and deployed a serverless stack across multiple global regions to minimize latency, with GeoSpatial queries and GeoHashing powering geofence and location-based alerting.
      - Integrated mapping APIs including OpenStreetMap, Leaflet, Google Maps, and HERE Maps for geocoding and data visualization.
      - Built Spring Boot microservices and IoT applications using the MQTT protocol for device communication.
      - Designed a reactive, real-time UI using Meteor, Handlebars, and MongoDB, and contributed across the stack including CMS (Magnolia) and Kafka streaming.
      - Conducted rapid prototyping of proof-of-concept systems and matured them into production-grade AWS deployments.

