# Order here is display order — add a new entry at the top for your latest role.
experience:
  - company: Samsung Electronics America
    title: Staff Engineer, Back-End Server
    dateFrom: Feb 2025
    dateTo: Present
    summary: >
      Lead backend and DevOps engineer on Samsung TV's interactive advertising platform, across
      server-side ad insertion, playable ads, and AI-driven recommendations.
    highlights:
      - Replaced Fluent Bit, StatsD, AWS X-Ray daemon, and self-hosted Graphite/Grafana with the OpenTelemetry Collector, Prometheus-style metrics scraping, and AWS-managed storage, dashboards, and alerts. This brought logs, metrics, and traces together for faster debugging, let us retire self-managed components, and kept alerting independent of the systems being monitored.
      - Created a React and TypeScript CMS that lets Content Operations configure and publish linear TV channels.
      - Built a real-time pipeline with Kinesis, S3, Glue, and Athena for VAST ad events. Added QuickSight dashboards to report playable-ad performance.
      - Created a Kubernetes controller that keeps published channel records in MySQL in sync with Kubernetes custom resources (CRDs), automating channel infrastructure management.
      - Built a Node.js/NestJS origin on EKS for Samsung Smart TV's FAST service, replacing AWS Elemental MediaTailor Channel Assembly. It turns looping and scheduled playlists into continuous HLS streams through a CDN and supports SCTE-35 ad insertion and VAST playable ads.
      - Developed a GPT-based movie recommendation system using RAG with LangChain, Azure OpenAI, Azure AI Search, and Redis.
      - Configured LiteLLM as an internal gateway for developers to access Claude and Codex through Amazon Bedrock.
      - Owned a seven-version, zero-downtime Kubernetes upgrade (1.26 to 1.33) with a staged rollout, per-step validation, and a documented rollback runbook.
      - Reduced AWS infrastructure costs through instance rightsizing and workload-aware instance selection, automated cleanup of idle resources, and team-level cost visibility with budget alerts.
      - Reduced internal network egress costs by 75% by migrating service traffic to AWS VPC endpoints and updating route tables.
      - Own CI/CD and production operations for these systems. Every release reaches production through Terraform and Helm, and the remediations that page most often are automated away.

  - company: Samsung Electronics America
    title: Engineer 3, Software Process Engineer
    dateFrom: March 2022
    dateTo: Jan 2025
    summary: >
      Built and ran a low-latency cloud game streaming platform, including GPU virtualization
      and storage on a custom Kubernetes stack.
    highlights:
      - Automated GPU-backed virtual game machine provisioning with KubeVirt (Kubernetes + VMs) across AWS and OCI bare-metal, running games on NVIDIA and AMD GPUs via vGPU/SR-IOV on Windows and Linux.
      - Automated EKS/OKE machine image builds with Packer (qcow2), including host GPU driver management.
      - Integrated NVIDIA Device Plugin and NVIDIA GPU Operator into Kubernetes environments to support GPU resource discovery, allocation, and lifecycle management for GPU workloads.
      - Developed a custom Kubernetes host-port controller in Go to expose game machines externally at lower cost. Also containerized Windows games to run on Linux with Wine.
      - Stood up and ran a Rook + Ceph storage cluster for Read-Only-Many (ROX) persistent volumes, which AWS did not support natively.
      - Extended Puppetlabs' Go-based PVPool controller with Kubernetes volume snapshots, cutting PVC replication for game data to near-instant.
      - Delivered sub-100ms end-to-end latency for interactive cloud gameplay.
      - Led a 3-man DevOps team for the GameHub O&O platform, directing two engineers in architecting cloud infrastructure for in-house gaming strategies.

  - company: Samsung Electronics America
    title: Engineer 2, Software Process Engineer
    dateFrom: July 2019
    dateTo: Feb 2022
    summary: >
      Developed reactive microservices and real-time stream processing for wearable and B2B
      products.
    highlights:
      - Ran Node.js services on AWS EKS, deployed with Helm, for Samsung's wearable B2B products. They supported health monitoring, indoor positioning, proximity detection, and contact tracing.
      - Used MongoDB Atlas for location and sensor data in multi-tenant B2B wearable services, including heart rate, HRV, accelerometer signals, and sleep metrics.
      - Used Apache Flink and Complex Event Processing (CEP) to process real-time event streams and detect patterns across wearable sensor and location data.
      - Built a custom OAuth 2.0 authentication service integrating Samsung Account, AWS Cognito, Auth0, and Okta.
      - Contributed to security practices for infrastructure and sensitive health and biometric data, aligning system design and operational controls with HIPAA, CCPA requirements, SOC 2 controls, and NIST security frameworks.
      - Developed GraphQL APIs and reactive Java services with Spring WebFlux, MongoDB, and Kafka for wearable applications.
      - Used Terraform to build multi-region AWS infrastructure for availability, security, and regulatory requirements.

  - company: First Object Inc
    title: Server Engineer
    dateFrom: Aug 2015
    dateTo: July 2019
    summary: >
      Delivered geospatial, serverless backend services and full-stack applications across
      global regions.
    highlights:
      # Quoted: unquoted, YAML reads "Client: ..." as a mapping, not a string.
      - "Client: Samsung Electronics America."
      - Deployed serverless AWS applications across regions, using geospatial queries and geohashing for geofence and location alerts.
