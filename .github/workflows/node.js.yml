# Builds the resume + site on every push, and deploys to the `master` branch
# (GitHub Pages publish source) on pushes to `source`.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ source ]
  pull_request:
    branches: [ source ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      # Use the Google Chrome that's already preinstalled on GitHub's ubuntu-latest
      # runner image instead of a hand-maintained list of Ubuntu shared-library
      # package names for Puppeteer's bundled Chromium. That list breaks every time
      # Ubuntu renames a package (e.g. libgdk-pixbuf2.0-0 -> libgdk-pixbuf-2.0-0) —
      # GitHub keeps the preinstalled browser working across runner image updates,
      # so this sidesteps the problem entirely instead of chasing package renames.
      - name: Point Puppeteer at the runner's preinstalled Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "Using $CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          # Skip Puppeteer's own ~300MB Chromium download — we're using the
          # preinstalled Chrome above instead. Local dev machines don't set this,
          # so `yarn install` there still downloads Puppeteer's bundled Chromium
          # as normal.
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Generate resume HTML + PDF
        run: yarn build:file

      - name: Run tests
        run: yarn test -- --run

      - name: Build site
        run: yarn build

      - name: Publish GitHub Pages
        if: github.event_name == 'push'
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/jayasai470/jayasai470.github.io.git
          git config --global user.name "Jay Muppalla"
          yarn deploy -- -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
