# Builds the resume + site on every push, and deploys to the `master` branch
# (GitHub Pages publish source) on pushes to `source`.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ source ]
  pull_request:
    branches: [ source ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libnss3 lsb-release xdg-utils wget
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-liberation fonts-dejavu-core fontconfig fc-cache -f -v

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate resume HTML + PDF
        run: yarn build:file

      - name: Run tests
        run: yarn test -- --run

      - name: Build site
        run: yarn build

      - name: Publish GitHub Pages
        if: github.event_name == 'push'
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/jayasai470/jayasai470.github.io.git
          git config --global user.name "Jay Muppalla"
          yarn deploy -- -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
